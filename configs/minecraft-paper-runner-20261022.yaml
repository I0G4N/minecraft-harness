experiment:
  name: four-agent-paper-final-20261022
  profile: paper_aligned
  seed: null
  task: kill_dragon
  goal: The objective is to defeat the Ender Dragon, starting from the spawn of the
    session's shared Minecraft survival world. This is the only criterion. Any means
    of meeting it within the rules of survival mode is permitted, and the players
    decide how to share the work.
  stop_on_success: false
agents:
  count: 4
  max_turns: 100000
  max_no_progress_turns: 120
  max_model_failures: 20
  max_event_failures: 20
  # Paper-mode program output is bounded by context_chars (model budget); this
  # display cap applies to non-paper structured tool results.
  max_tool_result_chars: 224000
  paper_single_program: true
  paper_tight_interface: true
  retry_base_s: 2
  retry_max_s: 60
  context_chars: 224000
  paper_cli_output: true
  paper_shell_cli: true
  max_shell_output_bytes: 67108864
  max_shell_timeout_s: 194400
  default_shell_timeout_s: 120
model:
  kind: chat_completions
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  max_output_tokens: 4096
  # 4 MB carries the 224k-character context in the worst-case UTF-8/JSON
  # encoding; the old 1 MB default could fail at the first long compaction.
  max_request_bytes: 4000000
  max_retries: 0
  extra_body:
    thinking:
      type: disabled
  timeout_s: 180
collaboration:
  game_chat: true
  shared_memory: true
  chat_delivery: program_output
runtime:
  mode: minecraft
  lifecycle: paper_aligned
  leftover_policy: allow
  recover_session_loss: true
  # Same-host architecture: each player and the Observer run in an independent
  # container, reaching the central ledger/budget/memory/gateway/workspace
  # broker only through an authenticated local Unix-socket RPC. The control
  # plane (Supervisor) keeps the Docker socket; runners never receive it.
  runner_mode: container
  # Players use the pinned Pi coding-agent runtime (RPC mode): Pi owns the
  # agent loop/context/compaction/session; Python keeps the Supervisor, ledger,
  # budget, Observer and Minecraft gateway. The Observer stays on the Python
  # runner until the Pi read-only observer port is implemented.
  runner_runtime: pi
  pi_context_window: 64000
  runner_restart_limit: 5
  runner_startup_timeout_s: 120
  runner_heartbeat_timeout_s: 180
  runner_rpc_timeout_s: 120
  # Image provides Python 3.11; the read-only repo mount provides harness source
  # and the venv site-packages. The runner container never gets the Docker socket.
  runner_container_image: minecraft-harness-workspace:local
  runner_container_python: /usr/bin/python3.11
  runner_container_network: bridge
  runner_container_memory_mb: 1024
  runner_container_cpus: 1.0
  runner_container_read_only: true
  program_timeout_default_s: 60
  program_timeout_max_s: 194400
  response_max_bytes: 268435456
  max_background_jobs: 8
  max_background_ttl_ms: 129600000
  urls:
    player1: http://127.0.0.1:3101
    player2: http://127.0.0.1:3102
    player3: http://127.0.0.1:3103
    player4: http://127.0.0.1:3104
  token_envs:
    player1: BOT1_ADMIN_TOKEN
    player2: BOT2_ADMIN_TOKEN
    player3: BOT3_ADMIN_TOKEN
    player4: BOT4_ADMIN_TOKEN
  viewer_ports:
    player1: 3105
    player2: 3106
    player3: 3107
    player4: 3108
server:
  world_dir: ../infra/server-data/world
  managed_container: minecraft-paper-server
  log_path: ../infra/server-data/logs/latest.log
  save_interval_s: 300
  log_interval_s: 1
  require_fresh_world: true
workspace:
  provision: true
  image: minecraft-harness-workspace:local
  network: none
observer:
  mode: llm
  interval_s: 60
  allow_infra_requests: true
web:
  enabled: true
  provider: deepseek
  search_url: https://api.deepseek.com/v1/tools/search
  fetch_url: https://api.deepseek.com/v1/tools/fetch
  api_key_env: DEEPSEEK_API_KEY
  count: 10
  need_content: false
  timeout_s: 30
  max_response_bytes: 128000
  allowed_hosts:
  - github.com
  - prismarinejs.github.io
  - nodejs.org
  - minecraft.wiki
  - minecraft.fandom.com
storage:
  max_artifact_bytes: 34359738368
  max_run_bytes: 107374182400
  min_free_disk_bytes: 2147483648
  # Pi session JSONL is pruned/rotated at runner start and again at runner
  # shutdown (oldest first); the active session guard stops the runner if it
  # exceeds this cap. Artifacts beyond the shared cap become metadata-only
  # projections instead of being stored in full; usage is persisted per agent
  # under the runner state dir so restarts do not reset it. Both are also
  # enforced by the Supervisor storage guard.
  # Run-wide budget check: 5 agents x (6 GB artifacts + 2 GB session + 1 GB
  # archive) = 45 GB, leaving broad headroom in the 100 GiB run cap for the
  # ledger/evaluator/API artifacts. A player session may rotate at 95%; each
  # rotation is bounded (default 3) and recorded with a handoff summary.
  pi_session_max_bytes: 2000000000
  pi_session_rotation_limit: 3
  pi_artifact_max_bytes: 6000000000
supervision:
  recovery_attempts: 8
  max_recoveries: 60
  recovery_base_s: 5
  recovery_max_s: 120
  shutdown_timeout_s: 60
  # A single player's model/infrastructure failure is an experimental event,
  # not a reason to discard the whole 54-hour run. The Observer may degrade in
  # place and is reported as degraded evidence.
  agent_failure_policy: isolate
  observer_failure_policy: degrade
budgets:
  wall_time_minutes: 3240
  total_model_calls: 30000
  max_cost_usd: 1500.0
  # External search/fetch is outside the model token budget; cap it explicitly.
  max_web_calls: 2000
  max_input_tokens: 250000
  prices_per_million:
    input: 0.3
    cached_input: 0.006
    output: 1.2
