# 24-hour ceiling. Replace the model endpoint/name and verify the example prices.
# Start infra only after accepting its Minecraft EULA. Credentials stay in env.
experiment:
  name: four-agent-longrun
  task: kill_dragon
  goal: Cooperate in this survival world to defeat the Ender Dragon. Observe current state, keep source code and notes, and recover from failed plans.
agents:
  count: 4
  max_turns: 100000
  # The paper did not describe a stall cutoff. This is a deliberately high
  # framework safety bound for long runs; wall/call/cost budgets remain tighter.
  max_no_progress_turns: 120
  context_chars: 48000
  # Long wall-clock runs must tolerate transient provider/network failures.
  # Every retry is separately admitted/settled, so this is a bounded tolerance,
  # not a retry of an uncertain program action.
  max_model_failures: 20
  max_event_failures: 20
  retry_base_s: 2
  retry_max_s: 60
  model_request_timeout_s: 185
  max_tool_result_chars: 16000
  max_workspace_bytes: 64000000
  max_workspace_files: 4096
model:
  kind: chat_completions
  base_url: https://api.deepseek.com
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  max_output_tokens: 4096
  timeout_s: 180
  max_retries: 0
  max_request_bytes: 1000000
  max_response_bytes: 2000000
  extra_body:
    thinking:
      type: disabled
runtime:
  mode: minecraft
  recover_session_loss: true
  urls:
    player1: http://127.0.0.1:3101
    player2: http://127.0.0.1:3102
    player3: http://127.0.0.1:3103
    player4: http://127.0.0.1:3104
  token_envs:
    player1: BOT1_ADMIN_TOKEN
    player2: BOT2_ADMIN_TOKEN
    player3: BOT3_ADMIN_TOKEN
    player4: BOT4_ADMIN_TOKEN
  request_timeout_s: 10
  startup_timeout_s: 60
  heartbeat_interval_s: 5
  lease_timeout_s: 30
  response_max_bytes: 4194304
  program_timeout_default_s: 60
  program_timeout_max_s: 600
server:
  world_dir: ../infra/server-data/world
  log_path: ../infra/server-data/logs/latest.log
  managed_container: minecraft-harness-server
  save_interval_s: 60
  control_timeout_s: 90
  startup_timeout_s: 120
supervision:
  poll_interval_s: 0.2
  evaluation_interval_s: 2
  resource_check_interval_s: 5
  recovery_attempts: 8
  max_recoveries: 60
  recovery_base_s: 5
  recovery_max_s: 120
  shutdown_timeout_s: 60
storage:
  # 24h/20k-call budget: expect several GiB of model/tool artifacts; leave
  # headroom for logs, workspaces and world/checkpoint files.
  min_free_disk_bytes: 2147483648
  max_artifact_bytes: 34359738368
  max_run_bytes: 107374182400
  max_event_bytes: 4194304
budgets:
  wall_time_minutes: 1440
  total_model_calls: 20000
  max_cost_usd: 25
  # A conservative reservation bound, also checked against serialized UTF-8 bytes.
  max_input_tokens: 250000
  # EXAMPLE USD per million tokens: replace both with your actual frozen rates.
  prices_per_million:
    input: 10
    output: 30
observer:
  mode: rules
