name: ${HARNESS_PROJECT:-minecraft-paper}
services:
  server:
    read_only: true
    cap_drop: &id001
    - ALL
    security_opt: &id002
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 8g
    cpus: 2
    init: true
    restart: 'no'
    logging: &id003
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    container_name: ${MC_SERVER_CONTAINER:-minecraft-paper-server}
    image: minecraft-harness-server:1.20.4-research
    user: ${MC_UID:-1000}:${MC_GID:-1000}
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-false}
      MC_SEED: ${MC_SEED:-42}
      JAVA_XMS: 1G
      JAVA_XMX: 3G
    volumes:
    - ${SERVER_DATA_DIR:-./server-data}:/data
    networks:
    - world
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=128m
    stdin_open: true
    stop_grace_period: 60s
  identity1:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    init: true
    restart: unless-stopped
    logging: *id003
    image: minecraft-harness-control:research
    command:
    - node
    - src/identity-proxy.js
    environment:
      ALLOWED_USERNAME: player1
      MC_HOST: server
      MC_PORT: '25565'
      GAME_CHAT: ${GAME_CHAT:-true}
      VIEWER_PROXY_PORT: '3105'
      VIEWER_TARGET: 172.24.0.2
    networks:
      control: {}
      worker1:
        ipv4_address: 172.24.0.1
      world: {}
    depends_on:
    - server
    ports:
    - 127.0.0.1:3105:3105
  launcher1:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    init: true
    restart: unless-stopped
    logging: *id003
    image: minecraft-harness-launcher:research
    user: 0:0
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=32m
    environment:
      WORKER_AGENT_ID: player1
      WORKER_HOST_TOKEN: ${WORKER1_TOKEN:?Set unique WORKER1_TOKEN}
      WORKER_HOST_ID: ${HARNESS_PROJECT:-minecraft-paper}-player1
      WORKER_SANDBOX_IMAGE: minecraft-harness-worker:viewer
      WORKER_SANDBOX_RUNTIME: ${WORKER_SANDBOX_RUNTIME:-runsc}
      WORKER_NETWORK: minecraft-paper_worker1
      WORKER_MC_HOST: 172.24.0.1
      WORKER_BIND: 0.0.0.0
      WORKER_PORT: '3901'
      WORKER_IDENTITY_PROXY: 'true'
      WORKER_VIEWER_PORT: '3105'
      WORKER_MAX_MEMORY: 4g
      WORKER_IP: 172.24.0.2
    networks:
    - control
    depends_on:
    - identity1
  bot1:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    init: true
    restart: unless-stopped
    logging: *id003
    image: minecraft-harness-control:research
    environment:
      BIND: 0.0.0.0
      PORT: '3001'
      MODE: minecraft
      LIFECYCLE: paper_aligned
      MC_VERSION: 1.20.4
      ALLOWED_AGENT_ID: player1
      ALLOWED_USERNAME: player1
      TOKEN: ${BOT1_ADMIN_TOKEN:?Set BOT1_ADMIN_TOKEN}
      AGENT_TOKENS_JSON: ${BOT1_AGENT_TOKENS_JSON:-}
      WORKER_ENDPOINTS_JSON: '{"player1":{"endpoint":"tcp://launcher1:3901","token":"${WORKER1_TOKEN}"}}'
      SUPERVISOR_LEASE_MS: '30000'
      MAX_BACKGROUND_JOBS: '8'
      MAX_BACKGROUND_TTL_MS: '129600000'
      MAX_TIMEOUT_MS: '194400000'
      LEFTOVER_POLICY: allow
      CHAT_DELIVERY: program_output
      MAX_PROGRAM_LOGS: '65536'
      MAX_PROGRAM_LOG_BYTES: '67108864'
      MAX_RESULT_BYTES: '67108864'
      MAX_RESPONSE_BYTES: '268435456'
      MAX_WORKER_RSS_BYTES: '2147483648'
      PAPER_SINGLE_PROGRAM: 'true'
    ports:
    - 127.0.0.1:3101:3001
    networks:
    - control
    depends_on:
    - launcher1
  identity2:
    read_only: true
    cap_drop: *id001
    security_opt: *id002
    pids_limit: 256
