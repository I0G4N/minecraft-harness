# Deliberate stability deviation for research bots.
#
# Mineflayer movement under concurrent load can exceed Spigot's vanilla
# movement checks. The paper protocol only specifies standard survival; it
# does not prescribe an anti-cheat threshold. Give the local research bots
# generous headroom while keeping the checks enabled.
settings:
  bungeecord: false
world-settings:
  default:
    moved-too-quickly-multiplier: 1000.0
    moved-wrongly-threshold: 1.0
