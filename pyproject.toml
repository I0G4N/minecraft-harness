[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "minecraft-experiment-harness"
version = "0.1.0"
description = "Independent, evidence-driven multi coding-agent Minecraft experiments"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28,<1",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
mc-harness = "minecraft_harness.cli:main"
mc = "minecraft_harness.program_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minecraft_harness"]
